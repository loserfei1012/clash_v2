    <style>
        /* 全局與賽博朋克背景 */
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #050b05;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas 電子蛇畫布 */
        #snakeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 核心炫酷卡片 */
        .card {
            background: rgba(10, 25, 15, 0.85);
            padding: 35px 25px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.2), inset 0 0 15px rgba(0, 255, 100, 0.1);
            border: 1px solid rgba(0, 255, 100, 0.3);
            max-width: 440px;
            width: 90%;
            z-index: 10;
            position: relative;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 20px 0;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            font-weight: 700;
        }

        /* 炫酷下拉菜單樣式 */
        .select-box {
            width: 100%;
            padding: 12px;
            background: #0d2212;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 100, 0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .select-box option {
            background: #0a190f;
            color: #00ff66;
        }

        /* 產品詳情展示區域 */
        .product-display {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            border: 1px dashed rgba(0, 255, 100, 0.2);
            margin-bottom: 25px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .product-desc {
            font-size: 14px;
            color: #a3b8a8;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        /* 耀眼的白色核心價格文字 */
        .product-price {
            font-size: 22px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }

        /* 引導提示框 */
        .guide-box {
            font-size: 13px;
            color: #00ff66;
            background: rgba(0, 255, 100, 0.05);
            padding: 10px 18px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(0, 255, 100, 0.2);
            font-weight: bold;
        }

        .arrow {
            display: inline-block;
            animation: point 1.2s infinite;
        }

        @keyframes point {
            0% { transform: translate(0, 0); }
            50% { transform: translate(4px, 4px); }
            100% { transform: translate(0, 0); }
        }
    </style>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class TechSnake {
            constructor() { this.init(); }
            init() {
                this.length = Math.floor(Math.random() * 15) + 15;
                this.segments = [];
                let x = Math.random() * canvas.width; let y = Math.random() * canvas.height;
                for(let i=0; i<this.length; i++) this.segments.push({x: x, y: y});
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 2 + 1.5;
                this.turnSpeed = Math.random() * 0.2 - 0.1;
                this.width = Math.random() * 3 + 2;
            }
            update() {
                if (Math.random() < 0.05) this.turnSpeed = Math.random() * 0.3 - 0.15;
                this.angle += this.turnSpeed;
                let head = this.segments[0];
                let newHead = { x: head.x + Math.cos(this.angle) * this.speed, y: head.y + Math.sin(this.angle) * this.speed };
                if (newHead.x < -50) newHead.x = canvas.width + 50;
                if (newHead.x > canvas.width + 50) newHead.x = -50;
                if (newHead.y < -50) newHead.y = canvas.height + 50;
                if (newHead.y > canvas.height + 50) newHead.y = -50;
                this.segments.unshift(newHead); this.segments.pop();
            }
            draw() {
                ctx.beginPath(); ctx.moveTo(this.segments[0].x, this.segments[0].y);
                for (let i = 1; i < this.segments.length; i++) ctx.lineTo(this.segments[i].x, this.segments[i].y);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = this.width;
                ctx.strokeStyle = '#00ff66'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ff66'; ctx.stroke();
                ctx.lineWidth = this.width / 2; ctx.strokeStyle = '#ffffff'; ctx.shadowBlur = 0; ctx.stroke();
            }
        }
        const snakes = Array.from({length: 12}, () => new TechSnake());
        function animate() {
            ctx.fillStyle = 'rgba(5, 11, 5, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            snakes.forEach(snake => { snake.update(); snake.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
